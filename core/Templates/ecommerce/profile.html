{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'styles/index.css' %}">
{% endblock %}

{% block content %}
<section class="profile-page">
    <div class="profile-card">
        <h2>Your Profile</h2>
        <p>Hello, {{ user.username }}!</p>
        <p>This is your personal dashboard for orders, saved items, and account details.</p>
        <div class="profile-actions">
            <a href="{% url 'ecommerce:cart' %}">View Cart</a>
            <a href="{% url 'ecommerce:wishlist' %}">View Wishlist</a>
        </div>
    </div>
</section>
{% endblock %}
